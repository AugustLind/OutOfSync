  name: out_of_symc
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  network_info_plus: ^5.0.0
  udp: ^5.0.3
  cupertino_icons: ^1.0.6
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  # Sound effects
  audioplayers: ^6.0.0
  # Animations
  lottie: ^3.1.0
  # Local storage for scores
  shared_preferences: ^2.2.2
  # HTTP for cloud features
  http: ^1.2.1
  # UUID for unique IDs
  uuid: ^4.3.3
  # Device info
  device_info_plus: ^10.1.0
  # Connectivity checking
  connectivity_plus: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/animations/
